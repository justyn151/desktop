# view configuration. view writes this file when it's missing, so deleting
# it brings back the defaults. Comments are whole lines starting with # or ;.

[view]
# Behind the image: palette for the wallpaper palette's background, which
# follows wallpaper changes, or a color as #RRGGBB.
background = palette
# Behind transparent images: checker for a checkerboard, or background.
transparency = checker
# Enlarge images smaller than the window to fit it. When false, a small
# image shows one image pixel per screen pixel.
fit_enlarge = false
# Enlarging: auto is smooth below 400% and sharp square pixels from 400%,
# smooth is always smooth, nearest is always sharp. Shrinking always
# averages, so it doesn't shimmer.
filter = auto

[browse]
# Browsed when view is started without a FILE or DIRECTORY, such as from
# the launcher. A leading ~/ means your home.
start = ~/Pictures/Screenshots
# Go from the last image to the first and back.
wrap = true
# Order of a directory's images: natural (img2 before img10), name (plain
# byte order) or modified (oldest first).
sort = natural
