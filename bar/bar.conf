[bar]
height = 24
position = top
background = #353535
opacity = 0.78
foreground = #c5ad81
padding = 8
scale = 1.3

[font]
family = monospace
size = 14

[workspaces]
labels = 1,2,3,4,5,6,7,8,9
hide_empty = false
active_color = #ead4aa
occupied_color = #c5ad81
inactive_color = #887d69
urgent_color = #cf7777
spacing = 10
active_style = box

[network]
custom_text = ""
click_enabled = true
command = deal --app-id net --columns 84 --rows 26 -e net
enabled = true
show_ssid = true
show_strength = true
separator = " | "

[clock]
format = %a, %b %e  %l:%M%P

[volume]
enabled = true
custom_text = Vol
muted_color = #887d69
command = vol --follow
click = vol mixer
middle_click = vol mute
scroll_up = vol up
scroll_down = vol down

[bluetooth]
enabled = true
custom_text = BT
show_device = true
show_battery = true
off_color = #887d69
click_enabled = true
command = deal --app-id blue --columns 84 --rows 26 -e blue

[theme]
source = wallpaper
