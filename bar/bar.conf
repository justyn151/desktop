[bar]
height = 24
position = top
background = #353535
opacity = 0.78
foreground = #c5ad81
padding = 8
scale = 1.3

[font]
family = monospace
size = 14

[workspaces]
labels = 1,2,3,4,5,6,7,8,9
hide_empty = false
active_color = #ead4aa
occupied_color = #c5ad81
inactive_color = #887d69
urgent_color = #cf7777
spacing = 10
active_style = box

[network]
custom_text = ""
click_enabled = true
command = deal --app-id net --columns 84 --rows 26 -e net
enabled = true
show_ssid = true
show_strength = true
separator = " | "

[clock]
format = %a, %b %e  %l:%M%P

[volume]
enabled = true
custom_text = Vol
muted_color = #887d69
command = sh -c 'v() { wpctl get-volume @DEFAULT_AUDIO_SINK@; }; v; pactl subscribe | grep --line-buffered -E "on (sink|server)" | while read -r _; do v; done'
click =
middle_click = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
scroll_up = wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
scroll_down = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

[theme]
source = wallpaper
