# Copy to $XDG_CONFIG_HOME/deal/deal.conf or ~/.config/deal/deal.conf.
# Lines beginning with # or ; are comments. Values may contain #.

[window]
title = deal
app_id = deal
dynamic_title = true
padding = 8
# padding_horizontal = 8
# padding_vertical = 8
opacity = 1.0
columns = 80
rows = 24
# Compatibility setting. Decorations are controlled by the compositor.
decorations = true

[font]
family = monospace
size = 14
# Zoom limits and step are in pixels. Keep size between the two limits.
zoom_min = 6
zoom_max = 96
zoom_step = 1
letter_spacing = 0
line_spacing = 0

[cursor]
style = underline
blink = false
blink_interval = 500
thickness = 2

[colors]
foreground = #dce5ed
background = #10161e
cursor = #dce5ed
# Bold also brightens the default and first eight colors.
bold_is_bright = true

[palette]
# Entries 1 through 16 override the ANSI palette, also with a wallpaper theme.
# 2 = #bf616a

[theme]
# manual uses the colors above. wallpaper follows the palette that wall
# publishes and updates open windows when the wallpaper changes.
source = manual

[selection]
foreground = #10161e
background = #8ac1de
# Publish selected text where the compositor supports primary selection.
primary = true
# Maximum interval between clicks in a word or logical-line selection.
click_interval = 350
# Let programs, including ones over ssh, copy to the clipboard with OSC 52.
# Reading the clipboard this way is never allowed.
osc52 = true

[terminal]
# shell = /bin/bash
term = xterm-color

[scrollback]
capacity = 10000
scroll_on_input = true
scroll_lines = 3

[mouse]
# Hold the override for local selection and scrollback.
reporting = true
selection_override = Shift

[hyperlinks]
enabled = true
modifier = Ctrl

[bell]
visual = false
# Audible bells are not supported yet. The setting is accepted.
audible = false
# Mark an unfocused window urgent when a program rings the bell.
urgency = false

[shortcuts]
zoom_in = Ctrl+Shift+=
zoom_out = Ctrl+Shift+-
zoom_reset = Ctrl+Shift+0

[keybinds]
reload_config = Ctrl+Shift+R
# Set fullscreen or new_window to false to disable the shortcut.
fullscreen = F11
# Open another deal in the shell's current directory.
new_window = Ctrl+Shift+N
