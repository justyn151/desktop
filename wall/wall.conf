[wallpaper]
# Example: path = ~/Pictures/My Wallpaper.png
path =
mode = fill
background = #353535

[transition]
enabled = true
type = random
duration = 650
fps = 144
easing = ease_in_out
effects = fade, slide, circle, wipe, diagonal, grow

[colors]
enabled = true
theme = dark
method = kmeans
samples = 4096
contrast = 4.5

[browser]
# Separate multiple directories with commas. Spaces inside paths are accepted.
directories = ~/Pictures/Wallpapers
recursive = true
columns = auto
thumbnail_width = 240
thumbnail_height = 135
cache = true
close_on_apply = true

[appearance]
background = #353535
foreground = #c5ad81
highlight = #ead4aa
muted = #887d69
font = DejaVu Sans Mono
font_size = 14

[theme]
source = wallpaper
