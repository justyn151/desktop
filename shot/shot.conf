# shot configuration. shot writes this file when it's missing, so deleting
# it brings back the defaults. Comments are whole lines starting with # or ;.

[save]
# Where captures go when no FILE is given. A leading ~/ means your home.
directory = ~/Pictures/Screenshots
# File name, as a strftime(3) format. When the name is taken, shot adds
# -1, -2 and so on before .png instead of replacing the file.
name = %Y-%m-%d_%H-%M-%S.png
# Also copy every saved capture to the clipboard. -C copies one capture
# even when this is false, and without a FILE it copies instead of saving.
clipboard = true

[capture]
# Paint the cursor into every capture. -c does it for one capture.
cursor = false

[png]
# zlib compression from 0 (fastest, largest file) to 9 (slowest, smallest).
compression = 6

[region]
# How much to darken the screen outside the selection, from 0 to 1.
dim = 0.5
# Selection outline width in logical pixels. 0 hides it.
border = 2
# Outline color: #RRGGBB, or accent for the wallpaper palette's accent.
color = accent
