[appearance]
background = #353535
foreground = #c5ad81
highlight = #ead4aa
muted = #887d69
selected_background = #c5ad81
selected_foreground = #353535
opacity = 0.78
height = 24
padding = 8
# Omit this to inherit scale from bar.conf.
# scale = 1.0

[font]
file = /usr/share/fonts/noto/NotoSansMono-Regular.ttf
size = 14

[layout]
prompt = run:
input_width = 240
result_spacing = 12

[applications]
desktop_entries = true
path_commands = true
prefer_desktop_entries = true
terminal = deal -e

[search]
case_sensitive = false
fuzzy = true

[theme]
source = wallpaper
