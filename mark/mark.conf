# mark's settings. mark writes this file on first run; edit it freely.
# The command line wins over it: --width, --no-pager. Comments go on lines
# of their own.

[layout]
# The widest the text gets; 0 follows the terminal.
width = 80
# Blank columns left of the text in the pager.
margin = 2

[colors]
# palette takes wall's colors in RGB and follows the wallpaper as it
# changes; ansi uses the terminal's 16 colors, for terminals with a scheme
# of their own. Without a palette from wall, mark uses ansi.
source = palette

[pager]
# false prints even to a terminal, like --no-pager.
enable = true
# Wheel scrolling and clicks on links. Hold Shift to select text in deal.
mouse = true
wheel_lines = 3

[links]
# Runs links that aren't markdown, with the URL as its last argument.
open = xdg-open
