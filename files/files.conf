# files configuration. files writes this file when it's missing, so deleting
# it brings back the defaults. Comments are whole lines starting with # or ;.
# Changes take effect the next time files starts.

[layout]
# Text size in points.
font_size = 11
# How solid the window's background is, from 0.1 to 1. Text, menus and
# dialogs stay solid.
opacity = 0.8

[view]
# list or icons, for folders without a view of their own. Switching the view
# in a folder (Ctrl+1, Ctrl+2, or the buttons) is remembered for that folder.
view = list
# Show hidden files (names starting with a dot) from the start. Ctrl+H
# toggles them in the window.
hidden = false
# name, type, size or modified. Clicking a heading changes it, and the
# window's choice is kept from then on.
sort = name
# Folders before files.
directories_first = true
# double: a double-click opens. single: a click opens; Ctrl or Shift and a
# click still select.
click = double

[thumbnails]
# Pictures of images in the icon view, cached in ~/.cache/thumbnails.
enable = true
# The largest image decoded for one, in MiB of pixels (a 4000×3000 photo is
# about 46).
image_limit = 256

[safety]
# Folders outside your home that files may change, separated by ':'. Empty
# keeps files to your home and your trash. Run as root, files may change
# anything regardless.
writable =

[open]
# How applications with Terminal=true are started, such as "deal -e".
# Empty uses run's [applications] terminal, or deal -e without one.
terminal =
